[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwrobot"
version = "0.1.0"
description = "A pen-plotter robot that writes on real paper in my own handwriting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Install only what the phase you're on needs, e.g. `pip install -e ".[dev]"`.
dev = ["pytest>=8.0", "httpx>=0.27"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
model = ["torch>=2.2"]
vision = ["opencv-python>=4.9"]
hardware = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwrobot = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
